<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔐 Security Mail Analyzer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🔐</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg-primary: #0f1117;
      --bg-secondary: #1a1d2e;
      --bg-card: #1e2235;
      --bg-card-hover: #252840;
      --accent-blue: #4361ee;
      --accent-cyan: #4cc9f0;
      --accent-green: #06d6a0;
      --accent-red: #ef233c;
      --accent-orange: #fb8500;
      --accent-yellow: #ffd60a;
      --accent-purple: #7b2d8b;
      --text-primary: #e8eaf6;
      --text-secondary: #9fa8da;
      --text-muted: #5c6bc0;
      --border: #2d3561;
      --border-light: #3d4475;
      --critical: #ef233c;
      --high: #fb8500;
      --medium: #ffd60a;
      --low: #06d6a0;
      --info: #4cc9f0;
      --sidebar-width: 240px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: var(--sidebar-width);
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 100;
    }

    .sidebar-logo {
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-logo h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-logo p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 13px;
      transition: all 0.2s;
      border-left: 3px solid transparent;
    }

    .nav-item:hover {
      background: var(--bg-card);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: rgba(67, 97, 238, 0.15);
      color: var(--accent-blue);
      border-left-color: var(--accent-blue);
    }

    .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }

    .nav-section {
      padding: 8px 16px 4px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 8px;
    }

    .status-bar {
      margin-top: auto;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    .status-dot.error { background: var(--critical); animation: none; }
    .status-dot.warning { background: var(--accent-orange); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Main content */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top bar */
    #topbar {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .topbar-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .topbar-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* Buttons */
    .btn {
      padding: 7px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--accent-blue);
      color: white;
    }
    .btn-primary:hover { background: #3251d3; }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--bg-card-hover); color: var(--text-primary); }

    .btn-danger { background: var(--critical); color: white; }
    .btn-danger:hover { background: #c8102e; }

    .btn-success { background: var(--accent-green); color: #0a1a14; }
    .btn-success:hover { background: #05b888; }

    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* Page content */
    #page-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Stat Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
    }

    .stat-card.total::before { background: var(--accent-blue); }
    .stat-card.critical::before { background: var(--critical); }
    .stat-card.high::before { background: var(--high); }
    .stat-card.medium::before { background: var(--medium); }
    .stat-card.low::before { background: var(--low); }
    .stat-card.fp::before { background: var(--accent-purple); }
    .stat-card.repeated::before { background: var(--info); }
    .stat-card.llm::before { background: var(--accent-cyan); }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-card.total .stat-value { color: var(--accent-blue); }
    .stat-card.critical .stat-value { color: var(--critical); }
    .stat-card.high .stat-value { color: var(--high); }
    .stat-card.medium .stat-value { color: var(--medium); }
    .stat-card.low .stat-value { color: var(--low); }
    .stat-card.fp .stat-value { color: #c77dff; }
    .stat-card.repeated .stat-value { color: var(--info); }
    .stat-card.llm .stat-value { color: var(--accent-cyan); }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Tables */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      padding: 10px 12px;
      text-align: left;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
      vertical-align: middle;
    }

    tr:hover td { background: var(--bg-card-hover); }
    tr:last-child td { border-bottom: none; }

    /* Severity badges */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-critical { background: rgba(239,35,60,0.2); color: #ff6b7a; border: 1px solid rgba(239,35,60,0.4); }
    .badge-high { background: rgba(251,133,0,0.2); color: #ffa333; border: 1px solid rgba(251,133,0,0.4); }
    .badge-medium { background: rgba(255,214,10,0.15); color: #ffe033; border: 1px solid rgba(255,214,10,0.4); }
    .badge-low { background: rgba(6,214,160,0.15); color: #06d6a0; border: 1px solid rgba(6,214,160,0.4); }
    .badge-info { background: rgba(76,201,240,0.15); color: #4cc9f0; border: 1px solid rgba(76,201,240,0.4); }
    .badge-fp { background: rgba(123,45,139,0.2); color: #c77dff; border: 1px solid rgba(123,45,139,0.4); }
    .badge-rep { background: rgba(76,201,240,0.15); color: #4cc9f0; }
    .badge-new { background: rgba(67,97,238,0.2); color: #748ffc; border: 1px solid rgba(67,97,238,0.4); }
    .badge-analyzed { background: rgba(6,214,160,0.15); color: #06d6a0; border: 1px solid rgba(6,214,160,0.4); }
    .badge-closed { background: rgba(92,107,192,0.2); color: #7986cb; }

    /* Forms */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 12px;
      color: var(--text-primary);
      font-size: 13px;
      transition: border-color 0.2s;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--accent-blue);
    }

    .form-textarea { min-height: 100px; resize: vertical; }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 700px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title { font-size: 16px; font-weight: 600; }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 20px;
      padding: 4px;
      line-height: 1;
    }

    .modal-close:hover { color: var(--text-primary); }

    /* Alert detail */
    .detail-section {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .detail-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .detail-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .detail-content {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .ip-chip {
      display: inline-block;
      padding: 3px 10px;
      background: rgba(239,35,60,0.15);
      color: #ff6b7a;
      border: 1px solid rgba(239,35,60,0.3);
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      cursor: pointer;
      margin: 2px;
      transition: all 0.2s;
    }

    .ip-chip:hover {
      background: rgba(239,35,60,0.3);
    }

    /* IP lookup result */
    .ip-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .ip-info-item {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
    }

    .ip-info-label {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .ip-info-value {
      font-size: 14px;
      color: var(--text-primary);
      font-weight: 500;
    }

    .threat-score {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .threat-bar {
      flex: 1;
      height: 8px;
      background: var(--bg-primary);
      border-radius: 4px;
      overflow: hidden;
    }

    .threat-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s;
    }

    /* Chat */
    #chat-messages {
      height: 400px;
      overflow-y: auto;
      padding: 12px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .chat-message {
      margin-bottom: 14px;
      display: flex;
      gap: 10px;
    }

    .chat-message.user { flex-direction: row-reverse; }

    .chat-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .chat-message.user .chat-avatar {
      background: var(--accent-blue);
    }

    .chat-message.assistant .chat-avatar {
      background: rgba(76,201,240,0.2);
    }

    .chat-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .chat-message.user .chat-bubble {
      background: var(--accent-blue);
      color: white;
      border-bottom-right-radius: 3px;
    }

    .chat-message.assistant .chat-bubble {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: var(--text-muted);
      gap: 12px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Pagination */
    .pagination {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
      padding: 16px 0;
    }

    .page-btn {
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .page-btn:hover, .page-btn.active {
      background: var(--accent-blue);
      color: white;
      border-color: var(--accent-blue);
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Toast notification */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast-item {
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 13px;
      color: white;
      animation: slideIn 0.3s ease;
      max-width: 380px;
    }

    .toast-success { background: #06d6a0; color: #0a1a14; }
    .toast-error { background: var(--critical); }
    .toast-info { background: var(--accent-blue); }
    .toast-warning { background: var(--high); color: #1a0a00; }

    @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 2px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .tab {
      padding: 10px 18px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.2s;
    }

    .tab:hover { color: var(--text-secondary); }
    .tab.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }

    /* Filter bar */
    .filter-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .filter-bar .form-input, .filter-bar .form-select {
      width: auto;
    }

    /* Progress bar */
    .progress-bar {
      height: 6px;
      background: var(--bg-primary);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
      transition: width 0.3s;
    }

    /* Chart container */
    .chart-container {
      position: relative;
      height: 200px;
    }

    /* Grid layouts */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

    /* Link buttons */
    .ext-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: rgba(67,97,238,0.15);
      color: var(--accent-blue);
      border-radius: 4px;
      font-size: 11px;
      text-decoration: none;
      border: 1px solid rgba(67,97,238,0.3);
      margin: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ext-link:hover {
      background: rgba(67,97,238,0.3);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

    /* Risk level colors */
    .risk-critical { color: var(--critical); }
    .risk-high { color: var(--high); }
    .risk-medium { color: var(--medium); }
    .risk-low { color: var(--low); }

    /* Hidden */
    .hidden { display: none !important; }

    /* Responsive */
    @media (max-width: 768px) {
      #sidebar { display: none; }
      .form-row { grid-template-columns: 1fr; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<nav id="sidebar">
  <div class="sidebar-logo">
    <h1>🔐 SecMail AI</h1>
    <p>NVIDIA GB10 · Local LLM</p>
  </div>
  
  <div class="nav-section">분석</div>

  </div>
  <div class="nav-item" onclick="navigate('history')">
    <span class="icon">📋</span> 히스토리
  </div>
  
  <div class="nav-section">AI</div>
  <div class="nav-item" onclick="navigate('chat')">
    <span class="icon">🤖</span> AI 분석 채팅
  </div>
  <div class="nav-item" onclick="navigate('knowledge')">
    <span class="icon">🧠</span> 지식베이스
  </div>
  
  <div class="nav-section">관리</div>
  <div class="nav-item" onclick="navigate('gmail-config')">

  </div>
  <div class="nav-item" onclick="navigate('reports')">
    <span class="icon">📨</span> 리포트 발송
  </div>
  <div class="nav-item" onclick="navigate('settings')">
    <span class="icon">⚙️</span> 환경 설정
  </div>

  <div class="status-bar" id="sidebar-status">
    <div style="margin-bottom:6px;">
      <div id="llm-status-dot" class="status-dot warning" style="display:inline-block;"></div>
      <span id="llm-status-text" style="font-size:11px;">Gemma4 연결 중...</span>
    </div>
    <div style="margin-bottom:4px;">
      <div id="db-status-dot" class="status-dot warning" style="display:inline-block;"></div>
      <span id="db-status-text" style="font-size:11px;">DB 연결 중...</span>

  </div>
</nav>

<!-- Main -->
<div id="main">
  <!-- Topbar -->
  <div id="topbar">
    <div class="topbar-title" id="page-title">📊 대시보드</div>
    <div class="topbar-actions">
      <select class="form-select" id="period-select" onchange="updateDashboard()" style="width:120px;">
        <option value="1">오늘</option>
        <option value="7" selected>7일</option>
        <option value="30">30일</option>
        <option value="90">90일</option>
